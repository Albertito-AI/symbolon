name: OpenSSF Scorecard

on:
  push:
    branches: [main]

permissions:
  contents: read

cache-mode: none

concurrency:
  group: scorecard-main
  cancel-in-progress: true

jobs:
  analysis:
    if: github.repository == 'Albertito-AI/symbolon'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          publish_results: true

  verify-publication:
    needs: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the published result for this commit
        run: python3 .github/scripts/verify_scorecard.py "$GITHUB_REPOSITORY" "$GITHUB_SHA"
